spring.config.import=optional:file:.env[.properties]
spring.application.name=Reservas

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${APP_JWT_SECRET}
# Hardcodeado por ahora; cuando exista el frontend real, apuntar acá vía env var.
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:https://fabrica-2026-2-eap05-1.onrender.com/reset-password}

supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
# service_role key: bypassa RLS por completo. Solo se usa server-side en
# SupabaseAuthService para el Admin API (crear/borrar en auth.users). Nunca
# exponer al frontend ni loguear su valor.
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}

spring.mail.host=${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.thymeleaf.cache=false
server.port=${PORT:8080}

logging.level.org.springframework.boot.web.embedded.tomcat=INFO
# TEMPORAL: mismo objetivo que pediste (ver qué matchea authorizeHttpRequests
# por request) pero usando la instrumentación nativa de Spring Security en vez
# de un RequestMatcher custom. Quitar una vez resuelto el 403.
# Limitar HikariCP para no saturar Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
